<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle of the Sexes</title>
<style>
/* Warm brown ground, white type, blue (girls), green (boys). Helvetica. Tinted, borderless tiles; white primary, outlined secondary. */
:root{
  --bg:#40392f; --fg:#fff; --surface:rgba(255,255,255,.07); --well:rgba(0,0,0,.22); --girls:#6473ff; --boys:#d0ff64;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --s:14px; --m:17px; --l:28px; --xl:clamp(44px,9vw,84px);
  --ps:clamp(12px,1.3vw,20px); --pm:clamp(18px,2.4vw,38px); --pl:clamp(28px,4.4vw,72px); --pxl:clamp(48px,7.5vw,124px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 var(--m)/1.4 var(--font)}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;line-height:1.1}
h1{font-size:30px;line-height:1.13} h2{font-size:var(--pm)} h3{font-size:var(--m)}
b{font-weight:700}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--fg);border-radius:8px;padding:12px 16px;background:transparent}
button.primary{background:var(--fg);color:#000;border-color:var(--fg);font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
input[type=text],input[type=number],input[type=password]{font:inherit;color:var(--fg);background:var(--well);border:0;border-radius:8px;padding:12px 14px;width:100%;min-width:0}
input::placeholder{color:var(--fg);opacity:.55}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.muted{font-size:var(--s)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:8px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.girls{--team:var(--girls);--teamfill:color-mix(in srgb,var(--girls) 30%,transparent)} .boys{--team:var(--boys);--teamfill:color-mix(in srgb,var(--boys) 13%,transparent)} .wild{--team:var(--fg);--teamfill:var(--surface)}
.teamtxt{color:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:#000;padding:10px 18px;border-radius:8px;z-index:50}

/* home */
.home{max-width:1300px;margin:0 auto;padding:44px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));display:grid;column-gap:80px;row-gap:24px;align-items:start;
  grid-template-columns:minmax(0,595fr) minmax(0,625fr);
  grid-template-areas:"title actions" "intro cats" "play cats" "win cats" ". cats";grid-template-rows:auto auto auto auto 1fr}
.h-title{grid-area:title;font-size:30px;line-height:1.13}
.h-intro{grid-area:intro;margin:0;font-size:24px;line-height:1.29}
.h-actions{grid-area:actions;display:flex;flex-wrap:wrap;gap:10px}
.h-play{grid-area:play;padding-top:24px}.h-play h3{margin-bottom:6px}.h-play p{margin:0 0 24px}.h-play p:last-child{margin:0}
.h-win{grid-area:win;margin:24px 0 0;font-size:24px;line-height:1.29}
.h-cats{grid-area:cats;max-width:544px;width:100%;display:flex;flex-direction:column;gap:8px}
.h-cats h3,.h-cats p{text-align:center;margin:0}.h-cats h3{margin-top:24px}.h-cats .catgrid+p{margin-top:8px}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "intro" "actions" "play" "win" "cats";grid-template-rows:none}.h-cats{max-width:none}}
.cta{display:inline-block;background:var(--fg);color:#000;text-decoration:none;border-radius:8px;padding:14px 22px;font-weight:700}
.cta2{display:inline-block;border:1px solid var(--fg);border-radius:8px;padding:14px 22px;text-decoration:none}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catchip{min-height:85px;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.4;background:color-mix(in srgb,var(--tint) 18%,transparent)}
.catchip.girls{background:color-mix(in srgb,var(--girls) 30%,transparent)}
.catchip.boys{background:color-mix(in srgb,var(--boys) 13%,transparent)}
.big{font-size:var(--xl)}
.prep{margin-top:18px}.prep p{margin:6px 0 0}.prep ul{margin:8px 0 0;padding-left:20px}.prep li{margin:8px 0}
.prepbox{background:var(--surface);border-radius:8px;padding:14px 18px}.prepbox .prep{margin-top:8px}.prepbox .prep h3{display:none}
summary{cursor:pointer;font-size:var(--s)}
ol.rules{margin:0;padding-left:20px} ol.rules li{margin:6px 0}

/* builder */
.teampick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.teampick button{padding:12px;border:0;background:var(--teamfill,var(--surface));min-height:85px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.catrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--teamfill);min-height:72px;padding:14px 18px}
.catrow .em{font-size:var(--l)}
.count{font-size:var(--s);font-variant-numeric:tabular-nums;white-space:nowrap}
.count.ok::after{content:" \2713"}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.item{background:var(--surface);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff}
.item .cap{padding:8px 10px;font-size:var(--s);display:flex;justify-content:space-between;gap:6px;align-items:start}
.item .cap span{min-width:0;overflow-wrap:anywhere}
.item .x{padding:0 6px;border:0}
.blurbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.blurpanel{background:var(--bg);border-radius:12px;padding:16px;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
.blurpanel p{margin:0}
.blurstage{display:flex;justify-content:center;min-height:0}
.blurstage canvas{max-width:100%;max-height:65vh;touch-action:none;cursor:crosshair;border-radius:8px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cands button{padding:0;border-radius:8px;overflow:hidden;border:4px solid transparent;aspect-ratio:1}
.cands button.sel{border-color:var(--fg)}
.cands img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:0;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-size:var(--s)}
#newcat details summary{padding:4px 0}
.card button:not(.primary):not(.x):not(.sel){border-color:rgba(255,255,255,.6)}

/* host: board */
.stage{height:100%;display:flex;flex-direction:column;padding:2vh 2.5vw;gap:2vh}
.score{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.score .side{display:flex;align-items:center;gap:1.2vw;font-size:var(--pxl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .side .dot{font-size:.55em}
.score .mid{text-align:center;flex:1;min-width:0}
.score .mid .up{font-size:var(--pm);font-weight:700}
.score .mid .sub{font-size:var(--ps)}
.board{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:.6vw;min-height:0}
.tile{border:0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1vw;gap:.8vh;min-height:0;background:var(--teamfill);transition:opacity .2s}
.tile.wild{background:color-mix(in srgb,var(--tint,#fff) 18%,transparent)}
.tile .em{font-size:var(--pm);line-height:1}
.tile .nm{font-size:calc(var(--pm)*.72);line-height:1.15;overflow-wrap:anywhere}
.tile .tag{font-size:var(--ps);opacity:.8}
.tile.locked{opacity:.3;cursor:default}
.tile.owned{background:var(--owner);color:#000;opacity:1}
.tile.owned .tag{opacity:1}
.pickbar{display:flex;gap:1vw;justify-content:center;align-items:center;flex-wrap:wrap}
.pickbar button{font-size:var(--pm);padding:1.2vh 2.2vw;border:0;border-radius:8px;background:var(--teamfill)}
.pickbar button.primary{background:var(--fg)}
.pickbar .hud{font-size:var(--pm);font-variant-numeric:tabular-nums;margin-left:1vw}
.pickbar a{font-size:var(--ps);margin-left:1vw}
.tile.cand{cursor:default}
.tile.pend{outline:4px solid var(--fg);outline-offset:-4px;cursor:default}
.hostbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:var(--s)}
.hostbar button{padding:6px 12px}

/* host: play */
.play{height:100%;display:flex;flex-direction:column;padding:2vh 2.5vw;gap:1.5vh}
.ptop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw}
.ptop h2{text-align:center}
.ptop .who{font-size:var(--pl);line-height:1}
.ptop h2{font-weight:700}
.clock{font-size:var(--pl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:2.6ch;text-align:right}
.dside .clock{font-size:var(--pxl)}
.clock.low{animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}
.jg{height:100%;display:flex;flex-direction:column;padding:2vh 2.5vw;gap:2vh}
.jg-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;font-size:var(--pl);line-height:1}
.jg-top h2{text-align:center;font-size:var(--pm)} .jg-top .clock{text-align:right}
.jg-main{flex:1;min-height:0;border-radius:8px;background:var(--well);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw;gap:2vh}
.jg-label{margin:0;font-size:var(--pm)}
.jg-ans{font-size:clamp(40px,8vw,140px);font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.jg-ans.sm{font-size:var(--pl)}
.jg-main.split{display:grid;grid-template-columns:1fr 1fr;align-items:center}
.jg-pic{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.jg-pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.jg-main.split .jg-ans{font-size:clamp(32px,5vw,96px)}
.jg-text{display:flex;flex-direction:column;align-items:center;gap:2vh;min-width:0}
.jg-foot .ok{color:var(--boys)} .jg-foot .bad{color:#ff8a7a}
.jg-keys{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;height:30vh}
.jg-keys:empty{display:none}
.jg-keys button{font-size:var(--pl);border-radius:8px}
.jg-keys button.one{grid-column:1/-1}
.jg-keys.many{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));height:auto;min-height:30vh;grid-auto-rows:minmax(12vh,1fr)}
.jg-keys.many button{font-size:var(--pm)}
.jg-foot{display:flex;justify-content:space-between;gap:2vw;font-size:var(--s)}
.pimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;border-radius:8px;overflow:hidden;background:var(--well)}
.pimg img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
.pimg .ans{position:absolute;left:0;right:0;bottom:0;padding:1.5vh 2vw;font-size:var(--pl);font-weight:700;text-align:center;background:var(--bg)}
.pimg.ok .ans{background:var(--fg);color:#000}
.pimg.no .ans::before{content:"Pass · ";font-weight:400}
.pimg .msg{padding:4vw;text-align:center}
.pimg .msg h2{font-size:var(--pl)}
.pimg .msg p{font-size:var(--pm)}
.pbot{display:flex;align-items:center;justify-content:space-between;gap:2vw;font-size:var(--s)}
.pips{font-size:var(--pl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tally{font-size:var(--pl);font-weight:700;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:10px}
.keys button{font-size:var(--m);padding:12px 20px}
.keys .c{background:var(--fg);color:#000;font-weight:700}
.duelclocks{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.dside{display:flex;align-items:center;gap:1.5vw;padding:1vh 2vw;border-radius:8px;opacity:.4}
.dside.act{background:var(--teamfill);opacity:1}
.dside .lbl{font-size:calc(var(--pxl)*.55);line-height:1}
</style>
</head>
<body>
<div id="app" style="height:100%"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
const SB = "https://ippikfbtknoddvumwgil.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwcGlrZmJ0a25vZGR2dW13Z2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjA4NjcsImV4cCI6MjA5MjkzNjg2N30.iFxRH9IwHSYeJbpeOS-3UKp2H89CGd-rhC1WX-UzAH0";
const app = document.getElementById("app");
const TEAM = { girls: "Team 🟣", boys: "Team 🟢", wild: "Wildcards" };
const SYM = { girls: "🟣", boys: "🟢", wild: "★" };
const other = t => (t === "girls" ? "boys" : "girls");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

async function api(path, { method = "GET", body } = {}) {
  const r = await fetch(SB + "/rest/v1/" + path, { method, headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json", Prefer: "return=representation" }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
function toast(msg) { document.querySelector(".toast")?.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.append(d); setTimeout(() => d.remove(), 2600); }

/* ---------- router ---------- */
let stopLoop = null;
function route() {
  if (stopLoop) { stopLoop(); stopLoop = null; }
  const h = location.hash.replace("#", "");
  if (h === "build") renderBuild(); else if (h === "host" || h === "sandbox") hostInit(); else if (h === "practice") practiceInit(); else if (h === "judge" || h === "sandbox-judge") renderJudge(h === "sandbox-judge"); else renderHome();
}
window.addEventListener("hashchange", route);
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (G && !T && typeof isHost === "function" && isHost()) renderBoard(); }, 150); });

/* ---------- home ---------- */
function renderHome() {
  app.innerHTML = `<div class="home">
    <h1 class="h-title">Battle of the Sexes<br>Thanksgiving 2026 Edition</h1>
    <p class="h-intro">This is a picture-naming game, battle of the sexes. A picture goes up on the projector and the player has to say what it is. Each team builds categories it thinks the other team will struggle with.</p>
    <div class="h-actions"><a href="#build" class="cta">Build your team's categories</a><a href="#practice" class="cta2">Try a practice round</a></div>
    <div class="h-play"><h3>Game Play</h3>
      <p>⛳️ One player stands up at a time, and the teams take turns. First the category is chosen. Then the team decides who on the team goes up to play it. The clock starts at 60 seconds, and pictures appear on the projector one after another.</p>
      <p>🏞️ The player says out loud what each picture is. As soon as they get one right, the next picture appears. Every correct answer is worth one point for their team.</p>
      <p>🚫 If the player doesn't know a picture, they say “pass”. The answer is shown for 3 seconds while the clock keeps running, and then the next picture appears. There is no limit on passes, but each one uses up time.</p>
      <p>⌛ When the clock reaches zero the turn is over, and the points are added to the team's total on the scoreboard.</p>
      <p>✌️ Everyone plays twice, once in each round, so choose strategically. Round 1 uses everyday categories that are already loaded into the game. On your team's turn, a random category is revealed and your team picks who plays it. Round 2 uses the categories the teams built. On your team's turn, the other team chooses which of their categories you have to face, and then your team picks who plays it. A player can only go up once per round, and each category can only be played once.</p></div>
    <p class="h-win">🏅 The team with the most points after each player plays 2 rounds, 24 rounds in total, wins. If the score is tied, one player from each team plays a head-to-head tiebreak.</p>
    <div class="h-cats" id="homecats"><h3>The categories</h3><p>Round 1: Game created everyday categories.</p><div class="catgrid"></div><p>Round 2: Teams created bespoke categories.</p><div class="catgrid"></div></div>
  </div>`;
  loadHomeCats();
}
// tint a tile with the colour of its emoji: draw it small and average its pixels, weighting colourful ones more
const tintCache = {};
function emojiTint(emoji) {
  if (!emoji) return "#ffffff";
  if (tintCache[emoji]) return tintCache[emoji];
  try {
    const c = document.createElement("canvas"); c.width = c.height = 32;
    const x = c.getContext("2d", { willReadFrequently: true }); x.textAlign = "center"; x.textBaseline = "middle"; x.font = "26px sans-serif"; x.fillText(emoji, 16, 18);
    const d = x.getImageData(0, 0, 32, 32).data; let r = 0, g = 0, b = 0, w = 0;
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]), wt = 0.15 + (mx ? (mx - mn) / mx : 0); r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt; }
    tintCache[emoji] = w ? `rgb(${Math.round(r / w)},${Math.round(g / w)},${Math.round(b / w)})` : "#ffffff";
  } catch { tintCache[emoji] = "#ffffff"; }
  return tintCache[emoji];
}
async function loadHomeCats() {
  let cats;
  try { cats = await api("floor_categories?select=id,team,name,emoji&order=created_at"); } catch { return; }
  const box = document.getElementById("homecats"); if (!box) return;
  const sys = cats.filter(c => c.team === "wild").map(c => `<div class="catchip" style="--tint:${emojiTint(c.emoji)}"><span>${esc(c.emoji || "")}</span><span>${esc(c.name)}</span></div>`).join("");
  // team categories show as soon as a team creates them; empty slots stay as [Category] until the team has 6
  const team = t => { const made = cats.filter(c => c.team === t), dot = t === "girls" ? "🟣" : "🟢";
    return Array.from({ length: Math.max(6, made.length) }, (_, k) => `<div class="catchip ${t}"><span>${dot}</span><span>${made[k] ? `${esc(made[k].emoji || "")} ${esc(made[k].name)}` : "[Category]"}</span></div>`).join(""); };
  box.innerHTML = `<h3>The categories</h3><p>Round 1: Game created everyday categories.</p><div class="catgrid">${sys}</div>
    <p>Round 2: Teams created bespoke categories.</p><div class="catgrid">${team("girls")}${team("boys")}</div>`;
}

/* ---------- builder ---------- */
const FLOOR_IDEAS = "A-Listers|Oscar Winners|Comedians|Child Stars|Reality TV Stars|Game Show Hosts|News Personalities|SNL Alumni|Directors|Authors|CEOs|Billionaires|Athletes|Sports MVPs|Wrestlers|Rappers|Pop Stars|Rock Stars|Boy Bands|Girl Groups|Divas|Country Music|One Hit Wonders|Iconic Duos|Famous Hair|Fashion Icons|Fast Food|Snacks|Candy|Cheese|Pasta|Sushi|Breakfast|BBQ|Baked Goods|Pizza Toppings|Ice Cream Flavors|Beer|Tools|Car Parts|Cars|Classic Cars|Sports Equipment|Sneakers|Shoes|Clothing and Accessories|Toys|Games|School Supplies|Bathroom Items|Art Supplies|Electronics|Antiques|Bugs|Birds|Wild Animals|Ocean Animals|Puppies|Flowers|Trees|Plants|Gems|National Parks|Skylines|Islands|U.S. States|New York|Tourist Hotspots|Paintings|Constellations|Space|Weather|The Human Body|Transportation|Aviation|Halloween Costumes".split("|").map(n => ["", n]);
const IDEAS = { girls: FLOOR_IDEAS, boys: FLOOR_IDEAS };
const PREP = (first) => `<div class="prep"><h3>Game Prep</h3>
  <p>Build your team's categories! Each team needs to create 6 categories before Thanksgiving. Everyone on the team can help, and you can do it from your phone whenever you have a few minutes.</p>
  <ul>
  <li>${first}</li>
  <li>Create a category by giving it a name. If you're stuck, the page lists categories from the TV show The Floor that you can tap.</li>
  <li>Add pictures to the category one at a time. Type the answer the player will have to say, tap “Find pictures”, and choose the best photo from the options. You can also upload a photo of your own. Choose pictures that don't have the answer written on them, such as a name on a jersey or a label on a product.</li>
  <li>Try to get at least 15 pictures into each category. A player sees as many as they can get through in 60 seconds, so more is better.</li></ul></div>`;
const B = { me: store.get("floor_me", null), tab: "team", cats: [], items: [], open: null, cands: null, pick: null, busy: false, get team() { return this.me?.team; }, get name() { return this.me?.name; }, get scope() { return this.tab === "wild" ? "wild" : this.team; } };
async function loadBuild() {
  B.cats = await api(`floor_categories?team=eq.${B.scope}&order=created_at`);

// get a picture's bytes: straight from the site when it allows it, otherwise through our image-proxy function
async function fetchImageBlob(url) {
  try { const r = await fetch(url); if (r.ok) return await r.blob(); } catch { }
  const r = await fetch(`${SB}/functions/v1/image-proxy?u=${encodeURIComponent(url)}`, { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } });
  if (!r.ok) throw new Error("image unavailable"); return await r.blob();
}

      <div class="blurstage"><p class="muted">Loading the picture…</p></div>
      <div class="row"><button type="button" data-b="undo" disabled>Undo</button><span class="grow"></span><button type="button" data-b="cancel">Cancel</button><button type="button" class="primary" data-b="save" disabled>Save</button></div></div>`;

  const conn = () => { const el = document.getElementById("jconn"); if (!el) return; const ok = JUDGE.at && Date.now() - JUDGE.at < 8000;
    el.innerHTML = `<span class="${ok ? "ok" : "bad"}">●</span> ` + (ok ? "Connected to the projector" : JUDGE.at ? "Lost the projector. Check both laptops are online and on the matching links" : "Waiting for the projector"); };
  const id = setInterval(() => { if (!JUDGE.state || Date.now() - JUDGE.at > 8000) liveSend("hello", {}); conn(); }, 2000); conn(); stopLoop = () => clearInterval(id);
}
function onRemoteState(p) { if (!isJudge()) return; JUDGE.state = p; JUDGE.at = Date.now(); drawJudge(); judgeImg(p.next); }
function judgeSend(k, v) { liveSend("cmd", { k, v }); }
function drawJudge() {
  const s = JUDGE.state, $ = id => document.getElementById(id); if (!s || !$("jmain")) return;
  $("jwho").innerHTML = s.team && SYM[s.team] ? `${SYM[s.team]} ${esc(s.view === "board" ? "" : s.player || "")}` : "";
  $("jcat").textContent = s.cat ? `${s.emoji || ""} ${s.cat}` : "";
  const clk = s.view === "board" ? (s.phase === "player" && s.huddle !== null ? s.huddle : "") : s.time ?? "";
  $("jclock").textContent = String(clk);
  $("jclock").classList.toggle("low", clk !== "" && clk <= 5);
  $("jcount").textContent = s.view === "solo" ? `${s.correct} named` : "";
  let label = "", main = "", keys = "", many = false;
  const T_ = TEAM[s.team] || "";
  if (s.view === "board") {
    if (s.phase === "reveal") { label = `Round 1: ${T_} is up`; main = "Reveal a random category"; keys = `<button class="primary one" data-j="reveal">Reveal the category</button>`; }
    else if (s.phase === "cat") { label = `Round 2: ${T_} is up`; main = `${TEAM[other(s.team)]}, which of your categories does ${T_} face?`;
      many = true; keys = (s.cats || []).map(c => `<button data-j="cat" data-v="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</button>`).join(""); }
    else if (s.phase === "player") { label = `${T_}, who's going?`; main = `${esc(s.emoji || "")} ${esc(s.cat || "")}`;
      many = true; keys = (s.players?.length ? s.players.map(n => `<button class="primary" data-j="player" data-v="${esc(n)}">${esc(n)}</button>`).join("") : `<button class="primary" data-j="player" data-v="">Start the turn</button>`)
        + (s.round === 2 ? `<button data-j="unpick">Change category</button>` : ""); }
    else if (s.phase === "over") { label = "Game over"; main = s.score ? `${SYM.girls} ${s.score.girls} · ${SYM.boys} ${s.score.boys}` : ""; }
    else { label = "Waiting for the projector"; main = ""; }
  }
  else if (s.phase === "ready") { label = "Ready when the player is"; main = esc(s.cat || ""); keys = `<button class="primary one" data-j="start">Start</button>`; }
  else if (s.phase === "done") { label = "Turn over"; main = esc(s.headline || ""); keys = `<button class="primary one" data-j="continue">Back to the board</button>`; }
  else { label = s.phase === "flash" ? "Correct" : s.phase === "pass" ? "Passed" : "Answer"; main = esc(s.answer || "");
    const off = s.phase === "play" ? "" : " disabled"; keys = `<button data-j="pass"${off}>Pass</button><button class="primary" data-j="correct"${off}>Correct</button>`; }
  const sig = label + "|" + main + many;
  if ($("jtext").dataset.sig !== sig) { $("jtext").dataset.sig = sig; $("jtext").innerHTML = `<p class="jg-label">${label}</p><div class="jg-ans${many ? " sm" : ""}">${main}</div>`; }
  // the picture the player is looking at, next to the answer
  const want = s.view !== "board" && s.img ? s.img : "";
  if (JUDGE.shown !== want) {
    JUDGE.shown = want;
    if (!want) { $("jpic").hidden = true; $("jmain").classList.remove("split"); }
    else judgeImg(want).then(u => { if (JUDGE.shown !== want || !$("jimg")) return; $("jimg").src = u; $("jpic").hidden = !u; $("jmain").classList.toggle("split", !!u); });
  }
  $("jkeys").classList.toggle("many", many);
  if ($("jkeys").dataset.sig !== keys) { $("jkeys").dataset.sig = keys; $("jkeys").innerHTML = keys; $("jkeys").querySelectorAll("[data-j]").forEach(b => b.onclick = () => judgeSend(b.dataset.j, b.dataset.v)); }
}
window.addEventListener("keydown", e => {
  if (!isJudge() || !JUDGE.state) return;
  const k = e.key.toLowerCase(), ph = JUDGE.state.phase;
  if (JUDGE.state.view === "board") { if ((k === " " || k === "enter") && ph === "reveal") { e.preventDefault(); judgeSend("reveal"); } return; }
  if (k === " " || k === "enter") { e.preventDefault(); judgeSend(ph === "ready" ? "start" : ph === "done" ? "continue" : "correct"); }
  else if (k === "p") { e.preventDefault(); judgeSend("pass"); }
});
function leave() { if (stopLoop) { stopLoop(); stopLoop = null; } if (location.hash === "#practice") { T = null; location.hash = ""; } else renderBoard(); }
function setAnswer() { pushState(); }

/* sounds */
let actx = null;
function beep(f, d = .12, type = "sine") { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch {} }

function preload(items) { items.forEach(it => { const im = new Image(); im.onerror = () => { it.bad = true; }; im.src = it.image_url; it._im = im; }); }
function loop(fn) { let last = performance.now(); const id = setInterval(() => { const now = performance.now(), dt = (now - last) / 1000; last = now; fn(dt); }, 50); stopLoop = () => clearInterval(id); }
const fmt = s => String(Math.max(0, Math.ceil(s)));

/* ----- solo turn ----- */
function startTurn(cat, opt = {}) {
  const items = shuffle(cat.items); preload(items);
  const team = opt.practice ? (location.hash === "#practice" ? (B.team || "wild") : G.up) : cat.team === "wild" ? teamUp() : other(cat.team);
  T = { kind: "solo", cat, team, practice: !!opt.practice, items, i: -1, correct: 0, time: opt.practice ? 30 : G.cfg.clock, phase: "ready", hold: 0 };
  T.secs = T.time;
  T.player = opt.practice ? "" : opt.player || "";
  clearInterval(boardTimer); boardTimer = null;
  app.innerHTML = `<div class="play ${T.team}">
    <div class="ptop"><div class="who">${T.practice ? "Practice" : `<span aria-label="${TEAM[T.team]} up">${SYM[T.team]}</span> ${esc(T.player)}`}</div><h2>${esc(cat.emoji || "")} ${esc(cat.name)}</h2><div class="clock" id="clock">${fmt(T.time)}</div></div>
    <div class="pimg" id="pimg"></div>
    <div class="pbot"><div class="pips" id="pips"></div><div class="keys"><button class="p" data-k="p">Pass (P)</button><button class="c" data-k=" ">Correct (Space)</button></div></div></div>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { b.blur(); onKey({ key: b.dataset.k, preventDefault() {} }); });
  document.getElementById("pimg").onclick = () => { if (T && (T.phase === "ready" || T.phase === "done")) onKey({ key: " ", preventDefault() {} }); };
  show(); loop(tick);
}
function show() {
  const box = document.getElementById("pimg"); if (!box || !T) return;
  const it = T.items[T.i]; box.className = "pimg" + (T.phase === "flash" ? " ok" : T.phase === "pass" ? " no" : "");
  if (T.phase === "ready") {
    box.innerHTML = T.kind === "solo"
      ? `<div class="msg"><h2>Name as many as you can</h2><p>${T.practice ? "Tap Correct when you get one, Pass when you're stuck" : "Every one is a point. Say “pass” to skip"} (a pass costs ${G.cfg.pass}s).<br>Tap here to start.</p></div>`
      : `<div class="msg"><h2>Tiebreak duel</h2><p>One player from each team. Your clock only runs on your turn. Get it right to pass the turn.<br><b>${TEAM[T.active]} goes first.</b> Tap here to start.</p></div>`;
    setAnswer("Press Space to start");
  } else if (T.phase === "done") {
    box.innerHTML = `<div class="msg ${T.winner}"><h2>${T.winner && SYM[T.winner] && !T.headline.includes(SYM[T.winner]) ? SYM[T.winner] + " " : ""}${esc(T.headline)}</h2><p>${esc(T.detail)}<br>Tap here to continue.</p></div>`; setAnswer("");
  } else {
    box.innerHTML = `<img src="${esc(it.image_url)}" alt="">` + (T.phase === "flash" || T.phase === "pass" ? `<div class="ans">${esc(it.answer)}</div>` : ""); setAnswer(it.answer);
  }
  const pips = document.getElementById("pips"); if (pips && T.kind === "solo") pips.innerHTML = `${T.correct} named`;
  if (T.kind === "duel") ["girls", "boys"].forEach(t => document.getElementById("d" + t)?.classList.toggle("act", T.active === t && T.phase !== "done"));
}
function advance() {           // move to the next usable picture
  do { T.i++; } while (T.i < T.items.length && T.items[T.i].bad);
  if (T.i >= T.items.length) return T.kind === "solo" ? endSolo("Out of pictures") : endDuel(T.time.girls >= T.time.boys ? "girls" : "boys", "Out of pictures");
  T.phase = "play"; show();
}
function tick(dt) {
  if (!T) return;
  if (T.phase === "flash") { T.hold -= dt; if (T.hold <= 0) { if (T.kind === "duel") T.active = other(T.active); advance(); } }
  else if (T.phase === "play" || T.phase === "pass") {
    if (T.kind === "solo") T.time -= dt; else T.time[T.active] -= dt;
    if (T.phase === "pass") { T.hold -= dt; if (T.hold <= 0) advance(); }
    const now = T.kind === "solo" ? T.time : T.time[T.active];
    if (T && now <= 0 && T.phase !== "done") { beep(140, .6, "sawtooth"); T.kind === "solo" ? endSolo("Time's up") : endDuel(other(T.active), "Time's up"); }
  }
  if (!T) return;
  pushState();
  if (T.kind === "solo") { const c = document.getElementById("clock"); if (c) { c.textContent = fmt(T.time); c.classList.toggle("low", T.time <= 10); } }
  else ["girls", "boys"].forEach(t => { const c = document.getElementById("c" + t); if (c) { c.textContent = fmt(T.time[t]); c.classList.toggle("low", T.time[t] <= 10); } });
}
function endSolo(why) {
  if (!T.practice) { G.own[T.cat.id] = { owner: T.team, pts: T.correct, player: T.player || undefined, round: roundOf(T.cat) }; G.pend = null; saveG(); }
  T.phase = "done"; T.winner = T.team;
  T.headline = T.practice ? `${T.correct} named` : `${T.correct} ${T.correct === 1 ? "point" : "points"} for ${T.player || TEAM[T.team]}`;
  T.detail = T.practice ? `${why}. That was just practice, nothing is scored.` : `${why}.`; [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, .18), i * 130)); show();
}
/* ----- wildcard duel ----- */
function startDuel(cat) {
  const items = shuffle(cat.items); preload(items);
  T = { kind: "duel", cat, items, i: -1, time: { girls: G.cfg.duel, boys: G.cfg.duel }, active: Math.random() < .5 ? "girls" : "boys", phase: "ready", hold: 0 };
  app.innerHTML = `<div class="play wild">
    <div class="duelclocks"><div class="dside girls" id="dgirls"><span class="lbl dot" aria-label="Girls">${SYM.girls}</span><span class="clock" id="cgirls" style="text-align:center">${fmt(T.time.girls)}</span></div>
      <div style="text-align:center;min-width:0"><div class="who">Tiebreak duel</div><h2>${esc(cat.emoji || "")} ${esc(cat.name)}</h2></div>
      <div class="dside boys" id="dboys"><span class="lbl dot" aria-label="Boys">${SYM.boys}</span><span class="clock" id="cboys" style="text-align:center">${fmt(T.time.boys)}</span></div></div>
    <div class="pimg" id="pimg"></div>
    <div class="pbot"><div class="muted">Correct passes the turn. A pass costs ${G.cfg.pass}s and you stay up.</div><div class="keys"><button class="p" data-k="p">Pass (P)</button><button class="c" data-k=" ">Correct (Space)</button></div></div></div>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { b.blur(); onKey({ key: b.dataset.k, preventDefault() {} }); });
  document.getElementById("pimg").onclick = () => { if (T && (T.phase === "ready" || T.phase === "done")) onKey({ key: " ", preventDefault() {} }); };
  show(); loop(tick);
}
function endDuel(winner, why) {
  G.own[T.cat.id] = { owner: winner, pts: 1 }; saveG();
  T.phase = "done"; T.winner = winner; T.headline = `${TEAM[winner]} wins the tiebreak, +1`; T.detail = `${why} for ${TEAM[other(winner)]}.`;
  [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, .18), i * 130)); show();
}
/* ----- keys ----- */
function onKey(e) {
  if (!T || (!isHost() && location.hash !== "#practice")) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { if (T.practice || T.phase === "done" || T.phase === "ready" || confirm("Leave this round without scoring it?")) { leave(); } return; }
  const yes = k === " " || k === "enter" || k === "arrowright", no = k === "p" || k === "arrowdown";
  if (!yes && !no) return; e.preventDefault();
  if (T.phase === "ready") { if (yes) advance(); return; }
  if (T.phase === "done") { if (yes) { leave(); } return; }
  if (T.phase !== "play") return;
  if (yes) { beep(880, .1); if (T.kind === "solo") T.correct++; T.phase = "flash"; T.hold = .7; show(); }
  else { beep(200, .25, "square"); T.phase = "pass"; T.hold = G.cfg.pass; show(); }
}
window.addEventListener("keydown", onKey);
route();
</script>
