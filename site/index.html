<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Better Half Showdown · Thanksgiving 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PRIMETIME TV GAME SHOW DESIGN SYSTEM
   Deep arena navy stage, illuminated LED floor tiles, studio spotlight beams,
   Team Mrs. (electric violet) vs Team Mr. (electric volt), trophy gold.
   ========================================================================== */
:root{
  --bg:#060914;
  --bg2:#0c1328;
  --surface:rgba(17,26,54,.82);
  --surface-hi:rgba(27,40,80,.92);
  --well:rgba(4,7,18,.78);
  --border:rgba(148,180,255,.18);
  --border-hi:rgba(196,218,255,.38);

  --fg:#f8faff;
  --fg-dim:#9db1d8;

  --girls:#9461ff;
  --girls-hi:#c8adff;
  --girls-deep:#1e1248;
  --boys:#b4ff29;
  --boys-hi:#e0ff94;
  --boys-deep:#152b0e;
  --gold:#ffca28;
  --gold-hi:#ffe580;
  --cyan:#38bdf8;
  --ok:#22e58b;
  --danger:#ff4757;

  --font-display:"Barlow Condensed","Arial Narrow","Impact",sans-serif;
  --font-clock:"Chakra Petch","Barlow Condensed",ui-monospace,monospace;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  --s:14px; --m:16px; --l:26px; --xl:clamp(42px,8vw,78px);
  --ps:clamp(12px,1.2vw,18px); --pm:clamp(18px,2.2vw,34px); --pl:clamp(28px,4vw,66px); --pxl:clamp(46px,7vw,116px);

  --radius:14px;
  --radius-sm:10px;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  min-height:100%;margin:0;color:var(--fg);font:500 var(--m)/1.45 var(--font);
  background:
    radial-gradient(ellipse 68% 48% at 14% -8%, rgba(148,97,255,.26), transparent 62%),
    radial-gradient(ellipse 68% 48% at 86% -8%, rgba(180,255,41,.17), transparent 62%),
    radial-gradient(ellipse 55% 42% at 50% -12%, rgba(56,189,248,.16), transparent 65%),
    linear-gradient(180deg, #090f24 0%, #060914 48%, #04060f 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
/* subtle studio LED grid overlay across the arena */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(120,165,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,165,255,.045) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 90% 75% at 50% 25%, #000 35%, transparent 100%);
}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh}

h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:800;letter-spacing:.025em;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(34px,5vw,48px);text-transform:uppercase}
h2{font-size:var(--pm);text-transform:uppercase}
h3{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
b,strong{font-weight:700}
[hidden]{display:none!important}
a{color:inherit}

/* ---------- shared controls ---------- */
button,.btn{
  font:700 var(--m)/1.2 var(--font);color:var(--fg);cursor:pointer;
  border:1px solid var(--border-hi);border-radius:var(--radius-sm);
  padding:12px 18px;
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 14px rgba(0,0,0,.28);
  transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease, background .14s ease, opacity .14s ease;
}
button:hover:not(:disabled),.btn:hover{
  transform:translateY(-1px);
  border-color:rgba(255,255,255,.55);
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
}
button:active:not(:disabled),.btn:active{transform:translateY(0)}
button.primary{
  background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 100%);
  color:#0a0d18;border-color:rgba(255,244,196,.9);font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 8px 24px rgba(255,202,40,.28);
}
button.primary:hover:not(:disabled){
  background:linear-gradient(180deg, #fff0a8 0%, #ffd247 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 10px 30px rgba(255,202,40,.42);
}
button.danger{
  border-color:rgba(255,71,87,.5);color:#ff9aa3;
  background:rgba(255,71,87,.12);
}
button.danger:hover:not(:disabled){
  border-color:var(--danger);background:rgba(255,71,87,.22);color:#fff;
}
button.ghost{background:rgba(255,255,255,.04);border-color:var(--border)}
button:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{
  outline:3px solid var(--gold);outline-offset:2px;
}

input[type=text],input[type=number],input[type=password]{
  font:500 var(--m)/1.3 var(--font);color:var(--fg);
  background:var(--well);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;width:100%;min-width:0;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{
  border-color:var(--cyan);box-shadow:inset 0 2px 6px rgba(0,0,0,.45), 0 0 0 3px rgba(56,189,248,.18);
  outline:none;
}
input::placeholder{color:var(--fg-dim);opacity:.65}

.wrap{
  max-width:820px;margin:0 auto;
  padding:28px max(18px,env(safe-area-inset-right,0px)) 88px max(18px,env(safe-area-inset-left,0px));
}
.muted{font-size:var(--s);color:var(--fg-dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.card{
  background:linear-gradient(180deg, rgba(22,33,66,.88), rgba(11,17,37,.92));
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 14px 36px rgba(0,0,0,.38);
}

/* team color tokens */
.girls{
  --team:var(--girls);--team-hi:var(--girls-hi);--team-ink:#ffffff;
  --teamfill:linear-gradient(180deg, rgba(148,97,255,.32), rgba(74,40,168,.38));
  --team-border:rgba(182,148,255,.55);
  --team-glow:rgba(148,97,255,.34);
}
.boys{
  --team:var(--boys);--team-hi:var(--boys-hi);--team-ink:#071205;
  --teamfill:linear-gradient(180deg, rgba(180,255,41,.22), rgba(76,132,12,.26));
  --team-border:rgba(180,255,41,.52);
  --team-glow:rgba(180,255,41,.26);
}
.wild{
  --team:var(--cyan);--team-hi:#a5e6ff;--team-ink:#05101c;
  --teamfill:linear-gradient(180deg, rgba(56,189,248,.18), rgba(22,42,88,.45));
  --team-border:rgba(125,211,252,.35);
  --team-glow:rgba(56,189,248,.22);
}
.teamtxt{color:var(--team-hi,var(--fg))}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:linear-gradient(180deg, var(--gold-hi), var(--gold));color:#090d1a;
  font-weight:800;padding:12px 22px;border-radius:999px;z-index:80;
  box-shadow:0 12px 32px rgba(0,0,0,.55), 0 0 24px rgba(255,202,40,.35);
  animation:popIn .2s ease-out;
}
@keyframes popIn{from{opacity:0;transform:translate(-50%,10px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

/* back nav link */
.backlink{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:14px;font-weight:700;color:var(--fg-dim);
  padding:7px 12px;border-radius:999px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);transition:all .14s ease;
}
.backlink:hover{color:var(--fg);border-color:var(--border-hi);background:rgba(255,255,255,.09)}

/* ==========================================================================
   HOME / LANDING PAGE — TV GAME SHOW BROADCAST EXPERIENCE
   ========================================================================== */
.home-page{
  max-width:1200px;margin:0 auto;
  padding:22px max(18px,env(safe-area-inset-right,0px)) 76px max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:42px;
}

/* --- HERO STAGE WITH 3D ILLUMINATED FLOOR --- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;
  border:1px solid rgba(176,204,255,.24);
  background:
    radial-gradient(ellipse 64% 68% at 18% 0%, rgba(148,97,255,.34), transparent 62%),
    radial-gradient(ellipse 64% 68% at 82% 0%, rgba(180,255,41,.22), transparent 62%),
    radial-gradient(ellipse 52% 45% at 50% 8%, rgba(255,202,40,.16), transparent 60%),
    linear-gradient(180deg, #10193a 0%, #091026 56%, #050918 100%);
  padding:clamp(34px,5.5vw,60px) clamp(20px,4vw,48px) clamp(26px,4vw,38px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(56,189,248,.16),
    0 28px 70px rgba(0,0,0,.55);
  text-align:center;
}
/* 3D perspective studio LED floor receding behind the hero */
.hero-floor{
  position:absolute;left:-14%;right:-14%;bottom:-70px;height:250px;pointer-events:none;
  perspective:540px;overflow:hidden;opacity:.75;
  mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.55) 38%, rgba(0,0,0,.9) 100%);
}
.hero-floor-grid{
  width:100%;height:100%;
  transform:rotateX(64deg);transform-origin:50% 100%;
  display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(4,1fr);gap:8px;
  padding:10px;
}
.hero-floor-grid span{
  border-radius:6px;
  background:rgba(56,189,248,.07);
  border:1px solid rgba(110,175,255,.22);
  box-shadow:inset 0 0 14px rgba(56,189,248,.08);
}
.hero-floor-grid span.g{
  background:rgba(148,97,255,.22);border-color:rgba(182,148,255,.55);
  box-shadow:0 0 18px rgba(148,97,255,.32), inset 0 0 10px rgba(200,173,255,.22);
  animation:tileShimmer 4.6s ease-in-out infinite;
}
.hero-floor-grid span.b{
  background:rgba(180,255,41,.16);border-color:rgba(180,255,41,.5);
  box-shadow:0 0 18px rgba(180,255,41,.24), inset 0 0 10px rgba(224,255,148,.18);
  animation:tileShimmer 5.4s ease-in-out infinite .9s;
}
.hero-floor-grid span.au{
  background:rgba(255,202,40,.18);border-color:rgba(255,220,100,.6);
  box-shadow:0 0 20px rgba(255,202,40,.32);
  animation:tileShimmer 3.8s ease-in-out infinite 1.7s;
}
@keyframes tileShimmer{0%,100%{opacity:.55}50%{opacity:1}}

.hero-inner{position:relative;z-index:2;max-width:820px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px}
.edition-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;border-radius:999px;
  font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-hi);
  background:rgba(255,202,40,.12);
  border:1px solid rgba(255,202,40,.45);
  box-shadow:0 0 24px rgba(255,202,40,.16);
}
.edition-pill .dot-live{
  width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 10px var(--gold);
}
.show-kicker{
  font-family:var(--font-display);font-size:clamp(14px,1.7vw,18px);font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:#a9c3ef;margin-bottom:-10px;
}
.hero-title{
  font-family:var(--font-display);font-weight:900;font-style:italic;
  font-size:clamp(54px,9.5vw,108px);line-height:.88;letter-spacing:.01em;text-transform:uppercase;
  background:linear-gradient(180deg, #ffffff 0%, #edf4ff 52%, #b9ceff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(15,28,70,.85));
  padding:0 8px;
}
.vs-bar{
  display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  padding:7px 18px;border-radius:999px;
  background:rgba(6,10,24,.72);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);
}
.vs-team{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.vs-team.g{color:var(--girls-hi)}
.vs-team.b{color:var(--boys-hi)}
.vs-orb{width:11px;height:11px;border-radius:50%;display:inline-block}
.vs-orb.g{background:var(--girls);box-shadow:0 0 12px var(--girls)}
.vs-orb.b{background:var(--boys);box-shadow:0 0 12px var(--boys)}
.vs-badge{
  font-family:var(--font-display);font-size:14px;font-weight:900;font-style:italic;
  color:#080c18;background:linear-gradient(135deg, var(--gold-hi), var(--gold));
  padding:2px 9px;border-radius:6px;letter-spacing:.08em;
}
.hero-beam{
  width:min(420px,80%);height:3px;border-radius:999px;
  background:linear-gradient(90deg, transparent, var(--girls) 22%, var(--gold) 50%, var(--boys) 78%, transparent);
  box-shadow:0 0 18px rgba(255,202,40,.45);
}
.hero-sub{
  margin:0;max-width:600px;font-size:clamp(16px,2vw,20px);line-height:1.45;
  color:#d9e5ff;font-weight:500;
}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:4px}
.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  text-decoration:none;border-radius:12px;padding:15px 28px;
  font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:#080c18;
  background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 100%);
  border:1px solid rgba(255,248,204,.95);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 10px 30px rgba(255,202,40,.34);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.cta:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 14px 36px rgba(255,202,40,.48);filter:brightness(1.04)}
.cta2{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  text-decoration:none;border-radius:12px;padding:15px 24px;
  font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--fg);
  background:rgba(12,20,46,.76);
  border:1px solid rgba(164,196,255,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.cta2:hover{transform:translateY(-2px);border-color:#fff;background:rgba(28,44,92,.85)}

/* telemetry stat strip inside hero */
.hero-stats{
  position:relative;z-index:2;
  margin-top:28px;padding-top:20px;
  border-top:1px solid rgba(150,185,255,.16);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
}
.stat-tile{
  background:rgba(7,12,28,.7);border:1px solid rgba(148,180,255,.16);
  border-radius:12px;padding:12px 10px;backdrop-filter:blur(8px);
}
.stat-val{
  font-family:var(--font-clock);font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1;
  color:#fff;letter-spacing:.02em;
}
.stat-val.gold{color:var(--gold-hi)}
.stat-val.ok{color:var(--ok)}
.stat-val.red{color:#ff7b87}
.stat-lbl{
  margin-top:5px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);
}

/* --- SECTION HEADERS --- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sec-kicker{
  font-family:var(--font-display);font-size:14px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:3px;
}
.sec-head h2{font-size:clamp(28px,4vw,38px);letter-spacing:.03em}

/* --- 3-STEP HOW A TURN WORKS --- */
.steps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step-card{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg, rgba(19,30,62,.86), rgba(10,16,35,.92));
  border:1px solid var(--border);border-radius:18px;padding:22px 20px;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 12px 30px rgba(0,0,0,.32);
}
.step-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent,var(--cyan));box-shadow:0 0 16px var(--accent,var(--cyan));
}
.step-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step-num{
  font-family:var(--font-clock);font-size:13px;font-weight:700;letter-spacing:.12em;
  color:var(--accent,var(--cyan));
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  padding:4px 10px;border-radius:999px;
}
.step-ico{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:var(--accent,var(--cyan));
}
.step-card h3{font-size:25px;letter-spacing:.03em;color:#fff}
.step-card p{margin:0;font-size:15px;line-height:1.48;color:#c5d4f1}

/* --- 2-ROUND SHOWDOWN FORMAT --- */
.rounds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.round-card{
  position:relative;overflow:hidden;border-radius:18px;padding:22px;
  border:1px solid var(--border-hi);
  display:flex;flex-direction:column;gap:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 14px 34px rgba(0,0,0,.36);
}
.round-card.r1{
  background:
    radial-gradient(ellipse 80% 70% at 100% 0%, rgba(56,189,248,.18), transparent 65%),
    linear-gradient(180deg, rgba(18,31,66,.92), rgba(10,16,36,.95));
  border-color:rgba(56,189,248,.38);
}
.round-card.r2{
  background:
    radial-gradient(ellipse 65% 70% at 0% 0%, rgba(148,97,255,.22), transparent 60%),
    radial-gradient(ellipse 65% 70% at 100% 0%, rgba(180,255,41,.14), transparent 60%),
    linear-gradient(180deg, rgba(20,25,58,.92), rgba(10,15,34,.95));
  border-color:rgba(182,148,255,.4);
}
.round-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.round-tag{
  font-family:var(--font-display);font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 11px;border-radius:6px;
}
.r1 .round-tag{background:rgba(56,189,248,.18);color:#8ce0ff;border:1px solid rgba(56,189,248,.4)}
.r2 .round-tag{background:rgba(148,97,255,.22);color:var(--girls-hi);border:1px solid rgba(182,148,255,.45)}
.round-count{font-family:var(--font-clock);font-size:13px;font-weight:700;color:var(--fg-dim);letter-spacing:.06em;text-transform:uppercase}
.round-card h3{font-size:28px;color:#fff}
.round-card p{margin:0;font-size:15px;color:#cad8f4;line-height:1.45}
.flow-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.flow-pill{
  font-size:12px;font-weight:700;letter-spacing:.03em;
  padding:6px 10px;border-radius:8px;
  background:rgba(5,9,22,.68);border:1px solid rgba(164,196,255,.2);color:#eaf1ff;
}
.flow-arrow{color:var(--gold);font-weight:800;font-size:13px}

/* Championship trophy banner */
.win-banner{
  margin-top:14px;border-radius:16px;padding:16px 20px;
  display:flex;align-items:center;gap:16px;
  background:
    radial-gradient(ellipse 40% 100% at 0% 50%, rgba(255,202,40,.18), transparent 70%),
    linear-gradient(90deg, rgba(28,25,18,.88), rgba(14,22,48,.88));
  border:1px solid rgba(255,202,40,.4);
  box-shadow:inset 0 1px 0 rgba(255,235,150,.18);
}
.win-icon{
  flex-shrink:0;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(180deg, rgba(255,202,40,.28), rgba(255,202,40,.1));
  border:1px solid rgba(255,202,40,.5);color:var(--gold-hi);
}
.win-banner p{margin:0;font-size:15px;line-height:1.45;color:#eef3ff}
.win-banner strong{color:var(--gold-hi)}

/* --- LIVE FLOOR SHOWCASE (CATEGORIES) --- */
.floor-frame{
  border-radius:22px;padding:24px;
  background:
    radial-gradient(ellipse 75% 40% at 50% 0%, rgba(56,189,248,.12), transparent 65%),
    linear-gradient(180deg, rgba(14,22,48,.92), rgba(7,11,26,.96));
  border:1px solid rgba(148,184,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 22px 54px rgba(0,0,0,.48);
  display:flex;flex-direction:column;gap:24px;
}
.floor-pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f-pill{
  font-family:var(--font-clock);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:rgba(5,9,22,.68);color:#d7e4ff;
}
.f-pill.g{border-color:rgba(182,148,255,.45);color:var(--girls-hi);background:rgba(148,97,255,.14)}
.f-pill.b{border-color:rgba(180,255,41,.42);color:var(--boys-hi);background:rgba(180,255,41,.1)}
.f-pill.r1{border-color:rgba(56,189,248,.4);color:#8ce0ff;background:rgba(56,189,248,.1)}

.floor-subhead{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-bottom:10px;
}
.floor-subhead h3{font-size:20px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.floor-subhead span{font-size:13px;color:var(--fg-dim);font-weight:600}
.floor-subhead h3 .by{font-family:inherit;font-size:13px;letter-spacing:.08em;color:var(--fg-dim);font-weight:600;text-transform:uppercase;align-self:flex-end;padding-bottom:3px}

.catgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
/* the board breaks out of the 1200px column so the tiles can be bigger on wide screens */
.board-wide{align-self:center;width:min(1560px, calc(100vw - 48px))}
.catgrid-teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.team-wing{
  background:rgba(5,9,22,.48);border:1px solid var(--border);border-radius:16px;padding:14px;
}
.team-wing.girls{border-color:rgba(148,97,255,.32);background:linear-gradient(180deg, rgba(148,97,255,.08), rgba(6,10,24,.55))}
.team-wing.boys{border-color:rgba(180,255,41,.28);background:linear-gradient(180deg, rgba(180,255,41,.06), rgba(6,10,24,.55))}
.team-wing .catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}

.catchip{
  position:relative;overflow:hidden;min-height:132px;border-radius:14px;padding:16px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;line-height:1.2;text-decoration:none;
  background:
    radial-gradient(ellipse 90% 70% at 50% 0%, color-mix(in srgb, var(--tint,#38bdf8) 28%, transparent), transparent 72%),
    linear-gradient(180deg, rgba(20,31,64,.92), rgba(11,17,38,.96));
  border:1px solid color-mix(in srgb, var(--tint,#38bdf8) 38%, rgba(148,180,255,.2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 6px 16px rgba(0,0,0,.3);
  transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.catchip::before{
  content:"";position:absolute;top:0;left:12%;right:12%;height:2px;border-radius:2px;
  background:var(--tint,#38bdf8);box-shadow:0 0 10px var(--tint,#38bdf8);opacity:.85;
}
.catchip .em{font-size:38px;line-height:1}
.catchip .nm{
  font-family:var(--font-display);font-size:clamp(17px,1.5vw,23px);font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  color:#f6f9ff;overflow-wrap:anywhere;
}
.catchip.girls{
  --tint:var(--girls);
  background:radial-gradient(ellipse 95% 75% at 50% 0%, rgba(148,97,255,.32), transparent 72%), linear-gradient(180deg, rgba(31,20,72,.92), rgba(16,12,40,.96));
  border-color:rgba(176,140,255,.45);
}
.catchip.boys{
  --tint:var(--boys);
  background:radial-gradient(ellipse 95% 75% at 50% 0%, rgba(180,255,41,.22), transparent 72%), linear-gradient(180deg, rgba(22,42,18,.92), rgba(11,22,12,.96));
  border-color:rgba(180,255,41,.42);
}
.catchip.empty{
  background:rgba(7,12,28,.45);border-style:dashed;border-color:rgba(148,180,255,.24);
  box-shadow:none;opacity:.75;
}
.catchip.empty::before{display:none}
.catchip.empty .nm{color:var(--fg-dim);font-size:14px;font-weight:600}
.catchip.empty:hover{opacity:1;transform:translateY(-2px);border-color:var(--gold);background:rgba(255,202,40,.08)}
.catchip.empty:hover .nm{color:var(--gold-hi)}

/* --- HOST CONTROL ROOM DRAWER --- */
.h-tools{
  border-radius:16px;border:1px solid var(--border);
  background:rgba(10,16,36,.72);overflow:hidden;
}
.h-tools summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;
  padding:15px 20px;font-family:var(--font-display);font-size:18px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);
  transition:color .14s ease, background .14s ease;
}
.h-tools summary:hover{color:#fff;background:rgba(255,255,255,.04)}
.h-tools summary::-webkit-details-marker{display:none}
.h-tools summary .chev{font-size:13px;transition:transform .2s ease}
.h-tools[open] summary .chev{transform:rotate(180deg)}
.h-tools .toolbox{
  padding:18px 20px 20px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:14px;background:rgba(6,10,24,.65);
}
.toollist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.toollist a{
  display:flex;flex-direction:column;gap:4px;text-decoration:none;
  background:linear-gradient(180deg, rgba(22,34,70,.8), rgba(12,18,40,.9));
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.toollist a:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.toollist a b{font-family:var(--font-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:#fff}

.lockscreen{
  max-width:440px;margin:12vh auto 0;padding:0 18px;
  display:flex;flex-direction:column;gap:16px;
}

/* ==========================================================================
   BUILDER — BACKSTAGE CATEGORY STUDIO
   ========================================================================== */
.build-hero{
  border-radius:18px;padding:22px;position:relative;overflow:hidden;
  border:1px solid var(--team-border,var(--border));
  background:
    radial-gradient(ellipse 75% 90% at 100% 0%, var(--team-glow,rgba(56,189,248,.16)), transparent 65%),
    linear-gradient(180deg, rgba(20,30,62,.92), rgba(10,16,36,.95));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 16px 38px rgba(0,0,0,.4);
}
.build-hero::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--team,var(--cyan));box-shadow:0 0 18px var(--team,var(--cyan));
}
.prog-wrap{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog-track{flex:1;height:10px;border-radius:999px;background:rgba(4,7,18,.8);border:1px solid rgba(255,255,255,.1);overflow:hidden}
.prog-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg, var(--team,var(--cyan)), var(--team-hi,#fff));
  box-shadow:0 0 14px var(--team-glow,rgba(56,189,248,.4));
  transition:width .35s ease;
}
.prog-fill.done{background:linear-gradient(90deg, #10b981, var(--ok));box-shadow:0 0 14px rgba(34,229,139,.5)}

.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.teampick button{
  padding:16px 12px;border:1px solid var(--team-border,var(--border));
  background:var(--teamfill,var(--surface));min-height:92px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 8px 20px rgba(0,0,0,.3);
}
.teampick button:hover{transform:translateY(-2px);border-color:var(--team-hi,#fff);box-shadow:0 10px 26px var(--team-glow,rgba(0,0,0,.4))}
.teampick button .orb{font-size:18px;line-height:1}

.catrow{
  display:flex;gap:14px;align-items:center;width:100%;text-align:left;
  border:1px solid var(--team-border,var(--border));background:var(--teamfill,var(--surface));
  min-height:76px;padding:14px 18px;border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 8px 20px rgba(0,0,0,.3);
}
.catrow:hover{border-color:var(--team-hi,#fff);transform:translateY(-2px);box-shadow:0 10px 26px var(--team-glow,rgba(0,0,0,.4))}
.catrow .em{
  width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  font-size:26px;background:rgba(5,9,22,.58);border:1px solid rgba(255,255,255,.14);
}
.catrow b{font-family:var(--font-display);font-size:23px;letter-spacing:.03em;text-transform:uppercase;display:block;line-height:1.1}

.count{
  font-family:var(--font-clock);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;padding:5px 11px;border-radius:999px;
  background:rgba(5,9,22,.65);border:1px solid rgba(255,255,255,.16);color:#dfe8ff;
}
.count.ok{background:rgba(34,229,139,.16);border-color:rgba(34,229,139,.55);color:var(--ok)}
.count.ok::after{content:" \2713"}

.prepbox{
  background:rgba(14,22,48,.75);border:1px solid var(--border);border-radius:14px;padding:14px 18px;
}
.prepbox summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--fg-dim)}
.prep{margin-top:10px}
.prep h3{font-size:20px;margin-bottom:6px}
.prep p{margin:6px 0 0;font-size:14px;color:var(--fg-dim)}
.prep ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:#cddaf5}
.prep li{margin:7px 0}
.prepbox .prep h3{display:none}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.item{
  background:rgba(14,22,48,.86);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 8px 20px rgba(0,0,0,.32);transition:transform .14s ease, border-color .14s ease;
}
.item:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.item img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;display:block}
.item .cap{padding:9px 10px;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center}
.item .cap > span:first-child{min-width:0;overflow-wrap:break-word;color:#eef4ff}
.item .x{padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,.05);box-shadow:none}
.item .x:hover{border-color:#fff}
.item .cap > .row{flex-shrink:0}

.blurbox{position:fixed;inset:0;background:rgba(3,6,16,.88);backdrop-filter:blur(8px);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.blurpanel{
  background:linear-gradient(180deg, #131e42, #090f24);
  border:1px solid var(--border-hi);border-radius:18px;padding:20px;
  width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 28px 80px rgba(0,0,0,.7);
}
.blurpanel p{margin:0;font-size:15px}
.blurstage{display:flex;justify-content:center;min-height:0;background:var(--well);border-radius:12px;padding:8px;border:1px solid var(--border)}
.blurstage canvas{max-width:100%;max-height:64vh;touch-action:none;cursor:crosshair;border-radius:8px}

.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cands button{padding:0;border-radius:10px;overflow:hidden;border:3px solid rgba(255,255,255,.12);aspect-ratio:1;background:#000}
.cands button.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,202,40,.35)}
.cands img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{
  border:1px solid var(--border);background:rgba(255,255,255,.06);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;box-shadow:none;
}
.chips button:hover{border-color:var(--gold);background:rgba(255,202,40,.14);color:var(--gold-hi)}
#newcat details summary{padding:4px 0;cursor:pointer;font-size:14px;font-weight:700;color:var(--cyan)}

/* ==========================================================================
   HOST PROJECTOR: THE BOARD
   ========================================================================== */
.stage{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:1.6vh 2.2vw;gap:1.5vh;overflow:hidden;
}

/* Primetime Broadcast Scorebug */
.score{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.8vw;
}
.score .side{
  display:flex;align-items:center;gap:1vw;
  padding:.9vh 1.6vw;border-radius:14px;
  font-family:var(--font-clock);font-size:var(--pxl);font-weight:700;line-height:.92;font-variant-numeric:tabular-nums;
  border:2px solid var(--team-border);background:var(--teamfill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 0 28px var(--team-glow);
  min-width:clamp(120px,13vw,220px);justify-content:center;
}
.score .side.girls{border-color:rgba(182,148,255,.65);color:#fff}
.score .side.boys{border-color:rgba(180,255,41,.65);color:var(--boys-hi)}
.score .side .dot{font-size:.42em;line-height:1}
.score .side .team-lbl{
  font-family:var(--font-display);font-size:var(--ps);font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;opacity:.9;display:block;
}
.score .side .meta{display:flex;flex-direction:column;align-items:center;gap:2px}

.score .mid{
  text-align:center;min-width:0;
  padding:.9vh 1.8vw;border-radius:14px;
  background:linear-gradient(180deg, rgba(19,30,66,.88), rgba(9,15,36,.92));
  border:1px solid rgba(164,196,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 28px rgba(0,0,0,.38);
}
.score .mid .up{
  font-family:var(--font-display);font-size:var(--pm);font-weight:900;letter-spacing:.04em;
  text-transform:uppercase;color:#fff;line-height:1.08;
}
.score .mid .sub{font-size:var(--ps);color:var(--fg-dim);font-weight:600;margin-top:2px}

/* Pickbar / Huddle Strip */
.pickbar{
  display:flex;gap:.9vw;justify-content:center;align-items:center;flex-wrap:wrap;
  padding:.8vh 1.4vw;border-radius:14px;
  background:rgba(10,16,38,.78);border:1px solid var(--team-border,var(--border));
  box-shadow:0 0 24px var(--team-glow,rgba(0,0,0,.3));
}
.pickbar button{
  font-family:var(--font-display);font-size:var(--pm);font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.9vh 2vw;border:1px solid var(--team-border,var(--border-hi));border-radius:10px;
  background:var(--teamfill);color:#fff;
}
.pickbar button:hover{transform:translateY(-2px);border-color:#fff;box-shadow:0 0 22px var(--team-glow)}
.pickbar button.primary{
  background:linear-gradient(180deg, var(--gold-hi), var(--gold));
  color:#080c18;border-color:#fff4c2;
  box-shadow:0 0 28px rgba(255,202,40,.42);
}
.pickbar .hud{
  font-family:var(--font-clock);font-size:var(--pm);font-weight:700;font-variant-numeric:tabular-nums;
  margin-left:.6vw;padding:.4vh 1vw;border-radius:8px;
  background:rgba(255,202,40,.14);border:1px solid rgba(255,202,40,.45);color:var(--gold-hi);
}
.pickbar a{font-size:var(--ps);margin-left:.8vw;color:var(--fg-dim);font-weight:700}

/* THE BOARD GRID */
.board{
  flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:.65vw;min-height:0;
  padding:.7vw;border-radius:18px;
  background:rgba(4,7,18,.78);
  border:2px solid rgba(120,165,255,.22);
  box-shadow:inset 0 0 40px rgba(0,0,0,.65), 0 0 36px rgba(56,189,248,.08);
}
.tile{
  position:relative;overflow:hidden;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:.8vw;gap:.5vh;min-height:0;
  border:1px solid rgba(148,180,255,.24);
  background:
    radial-gradient(ellipse 90% 70% at 50% 0%, color-mix(in srgb, var(--tint,#38bdf8) 26%, transparent), transparent 72%),
    linear-gradient(180deg, rgba(22,34,70,.92), rgba(11,18,40,.96));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 6px 18px rgba(0,0,0,.4);
  transition:transform .16s ease, opacity .2s ease, border-color .16s ease, box-shadow .16s ease;
}
.tile::before{
  content:"";position:absolute;top:0;left:10%;right:10%;height:3px;border-radius:3px;
  background:var(--tint,var(--team,#38bdf8));
  box-shadow:0 0 12px var(--tint,var(--team,#38bdf8));
  opacity:.85;
}
.tile.girls{
  --tint:var(--girls);
  background:radial-gradient(ellipse 90% 75% at 50% 0%, rgba(148,97,255,.32), transparent 72%), linear-gradient(180deg, rgba(32,20,76,.92), rgba(16,12,42,.96));
  border-color:rgba(176,140,255,.45);
}
.tile.boys{
  --tint:var(--boys);
  background:radial-gradient(ellipse 90% 75% at 50% 0%, rgba(180,255,41,.22), transparent 72%), linear-gradient(180deg, rgba(22,42,18,.92), rgba(11,22,12,.96));
  border-color:rgba(180,255,41,.42);
}
.tile .em{font-size:var(--pm);line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.tile .nm{
  font-family:var(--font-display);font-size:calc(var(--pm)*.78);font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;line-height:1.06;overflow-wrap:anywhere;color:#fff;
}
.tile .tag{
  font-family:var(--font-clock);font-size:calc(var(--ps)*.86);font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--fg-dim);
  padding:2px 8px;border-radius:999px;background:rgba(4,7,18,.5);
}
.tile.cand{cursor:default}
.tile.open{
  cursor:pointer;
  border-width:2px;border-color:var(--team-hi,#fff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 0 22px var(--team-glow);
}
.tile.open:hover{transform:scale(1.03);z-index:2;box-shadow:0 0 32px var(--team-glow), inset 0 0 18px rgba(255,255,255,.15)}
.tile.locked{opacity:.24;cursor:default;filter:saturate(.45)}
.tile.locked:hover{transform:none}
.tile.pend{
  z-index:3;opacity:1;cursor:default;
  border:3px solid var(--gold-hi);
  box-shadow:0 0 0 4px rgba(255,202,40,.28), 0 0 42px rgba(255,202,40,.65), inset 0 0 24px rgba(255,220,100,.25);
  animation:floorPulse 1.3s ease-in-out infinite;
}
@keyframes floorPulse{
  0%,100%{box-shadow:0 0 0 3px rgba(255,202,40,.25), 0 0 30px rgba(255,202,40,.5), inset 0 0 18px rgba(255,220,100,.18)}
  50%{box-shadow:0 0 0 6px rgba(255,202,40,.45), 0 0 54px rgba(255,202,40,.85), inset 0 0 28px rgba(255,220,100,.34)}
}
/* Conquered territory tile */
.tile.owned{
  opacity:1;border-width:2px;
}
.tile.owned::before{background:#fff;box-shadow:0 0 14px #fff;opacity:.65}
.tile.owned.owner-girls{
  background:linear-gradient(155deg, #a77bff 0%, #6f3df2 100%);
  border-color:#e2d4ff;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 0 24px rgba(148,97,255,.45);
}
.tile.owned.owner-girls .nm{color:#fff}
.tile.owned.owner-girls .tag{background:rgba(14,6,38,.45);color:#fff;border:1px solid rgba(255,255,255,.25)}

.tile.owned.owner-boys{
  background:linear-gradient(155deg, #d6ff66 0%, #8cd916 100%);
  border-color:#f2ffc2;color:#081604;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 0 24px rgba(180,255,41,.38);
}
.tile.owned.owner-boys .nm{color:#071403}
.tile.owned.owner-boys .tag{background:rgba(8,22,4,.82);color:var(--boys-hi)}

.hostbar{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--fg-dim);
  padding:8px 14px;border-radius:12px;
  background:rgba(8,13,30,.82);border:1px solid var(--border);
}
.hostbar button{padding:6px 12px;font-size:13px;border-radius:8px}
.hostbar a{font-weight:700;color:var(--fg-dim);text-decoration:none;padding:6px 10px}
.hostbar a:hover{color:#fff}

/* ==========================================================================
   HOST PROJECTOR: SOLO PLAY & TIEBREAK DUEL
   ========================================================================== */
.play{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:1.6vh 2.4vw;gap:1.3vh;overflow:hidden;
}
.ptop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw}
.ptop .who{

// The game screens open only after the host password. Only a SHA-256 hash of it is in this file. It keeps guests from
// starting the game by accident; it isn't real security, since the categories themselves are readable through the API.
const HOST_HASH = "92925488b28ab12584ac8fcaa8a27a0f497b2c62940c8f4fbc8ef19ebc87c43e";
const HOST_TOOLS = [
  ["host", "Projector", "The real game, on the laptop connected to the projector"],
  ["judge", "Judges' laptop", "Answers and Correct / Pass buttons for the real game"],
  ["sandbox", "Sandbox projector", "Test game with test categories only"],
  ["sandbox-judge", "Sandbox judges' laptop", "Judges' screen for the test game"],
  ["practice", "Practice round", "30 seconds of Farm Animals, nothing scored"],
];
const hostUnlocked = () => store.get("floor_host_ok", false) === true;
async function checkHostPassword(pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw.trim()));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("") === HOST_HASH;
}
const lockForm = msg => `<form class="stack" data-lock style="gap:10px"><p class="muted" style="margin:0">${msg}</p><div class="row"><div class="grow"><input type="password" inputmode="numeric" autocomplete="off" placeholder="Host password" aria-label="Host password" data-pw></div><button class="primary">Unlock</button></div><p class="muted" data-pwmsg style="margin:0;color:#ff8a95" hidden>That's not the password.</p></form>`;
function bindLock(root, onOk) {
  const f = root.querySelector("[data-lock]"); if (!f) return;
  f.onsubmit = async e => { e.preventDefault();
    if (await checkHostPassword(f.querySelector("[data-pw]").value)) { store.set("floor_host_ok", true); onOk(); }
    else { f.querySelector("[data-pwmsg]").hidden = false; f.querySelector("[data-pw]").select(); } };
}

// tint a tile with the colour of its emoji: draw it small and average its pixels, weighting colourful ones more
const tintCache = {};
function emojiTint(emoji) {
  if (!emoji) return "#38bdf8";
  if (tintCache[emoji]) return tintCache[emoji];
  try {
    const c = document.createElement("canvas"); c.width = c.height = 32;
    const x = c.getContext("2d", { willReadFrequently: true }); x.textAlign = "center"; x.textBaseline = "middle"; x.font = "26px sans-serif"; x.fillText(emoji, 16, 18);
    const d = x.getImageData(0, 0, 32, 32).data; let r = 0, g = 0, b = 0, w = 0;
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]), wt = 0.15 + (mx ? (mx - mn) / mx : 0); r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt; }
    tintCache[emoji] = w ? `rgb(${Math.round(r / w)},${Math.round(g / w)},${Math.round(b / w)})` : "#38bdf8";
  } catch { tintCache[emoji] = "#38bdf8"; }
  return tintCache[emoji];
}

/* ---------- live link between the projector and the judges' laptop (Supabase Realtime broadcast) ---------- */
const LIVE = { client: null, chan: null, name: null, ready: false, onReady: null, last: "", beat: null };
function liveChannel(name) {
  if (LIVE.name === name && LIVE.chan) return LIVE.chan;
  if (!window.supabase) return null;
  LIVE.client = LIVE.client || window.supabase.createClient(SB, KEY);
  if (LIVE.chan) LIVE.client.removeChannel(LIVE.chan);
  LIVE.name = name; LIVE.ready = false; LIVE.last = "";
  LIVE.chan = LIVE.client.channel(name, { config: { broadcast: { self: false } } })
    .on("broadcast", { event: "cmd" }, ({ payload }) => onRemoteCmd(payload || {}))
    .on("broadcast", { event: "hello" }, () => pushState(true))
    .on("broadcast", { event: "state" }, ({ payload }) => onRemoteState(payload || {}))
    .subscribe(st => { LIVE.ready = st === "SUBSCRIBED"; if (LIVE.ready && LIVE.onReady) LIVE.onReady(); });

}
function liveSend(event, payload) { if (LIVE.chan && LIVE.ready) try { LIVE.chan.send({ type: "broadcast", event, payload }); } catch {} }
function pushState(force) {
  if (!isHost() || !G) return;
  let st;

    const it = T.items[T.i], showing = T.phase === "play" || T.phase === "flash" || T.phase === "pass";
    st = { view: T.kind, phase: T.phase, cat: T.cat.name, emoji: T.cat.emoji || "", team: T.kind === "duel" ? T.active : T.team, player: T.player || "",
      answer: showing && it ? it.answer : "", img: showing && it ? it.id || "" : "", next: T.items[T.i + 1]?.id || "", time: Math.max(0, Math.ceil(T.kind === "duel" ? T.time[T.active] : T.time)), correct: T.correct || 0, practice: !!T.practice, headline: T.phase === "done" ? T.headline : "" };
  } else {
    const { r, up, pc, phase } = boardInfo(), h = huddleLeft();
    st = { view: "board", phase, round: r, team: up, cat: pc ? pc.name : "", emoji: pc ? pc.emoji || "" : "",
      players: phase === "player" ? playersLeft(up) : [], cats: phase === "cat" ? facing(up).map(c => ({ id: c.id, name: c.name, emoji: c.emoji || "" })) : [],
      huddle: h === null ? null : Math.ceil(h), score: { girls: count("girls"), boys: count("boys") } };
  }
  const key = JSON.stringify(st); if (!force && key === LIVE.last) return; LIVE.last = key; liveSend("state", st);
}
function onRemoteCmd(p) {
  if (!isHost() || !G) return;
  if (!T) {
    if (p.k === "reveal") revealCat(); else if (p.k === "cat") chooseCat(p.v); else if (p.k === "player") choosePlayer(p.v || ""); else if (p.k === "unpick") unchooseCat();
    return;
  }
  const press = key => onKey({ key, preventDefault() {} });
  if (p.k === "start" && T.phase === "ready") press(" ");
  else if (p.k === "correct" && T.phase === "play") press(" ");
  else if (p.k === "pass" && T.phase === "play") press("p");
  else if (p.k === "continue" && T.phase === "done") press(" ");
}

window.addEventListener("keydown", e => {

function leave() { if (stopLoop) { stopLoop(); stopLoop = null; } if (location.hash === "#practice") { T = null; location.hash = ""; } else renderBoard(); }

/* sounds */
let actx = null;
function beep(f, d = .12, type = "sine", vol = .15) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d); } catch {} }

function preload(items) { items.forEach(it => { const im = new Image(); im.onerror = () => { it.bad = true; }; im.src = it.image_url; it._im = im; }); }
function loop(fn) { let last = performance.now(); const id = setInterval(() => { const now = performance.now(), dt = (now - last) / 1000; last = now; fn(dt); }, 50); stopLoop = () => clearInterval(id); }
const fmt = s => String(Math.max(0, Math.ceil(s)));

/* ----- solo turn ----- */
function startTurn(cat, opt = {}) {
  const items = shuffle(cat.items); preload(items);
  const team = opt.practice ? (location.hash === "#practice" ? (B.team || "wild") : G.up) : cat.team === "wild" ? teamUp() : other(cat.team);
  T = { kind: "solo", cat, team, practice: !!opt.practice, items, i: -1, correct: 0, time: opt.practice ? 30 : G.cfg.clock, phase: "ready", hold: 0, lastSec: null };
  T.secs = T.time;
  T.player = opt.practice ? "" : opt.player || "";
  clearInterval(boardTimer); boardTimer = null;
  app.innerHTML = `<div class="play ${T.team}">
    <div class="ptop">
      <div class="who">${T.practice ? "★ Practice Round" : `<span aria-label="${TEAM[T.team]} up">${SYM[T.team]}</span> ${esc(T.player || TEAM[T.team])}`}</div>
      <h2>${esc(cat.emoji || "")} ${esc(cat.name)}</h2>
      <div class="clock" id="clock">${fmt(T.time)}</div>
    </div>
    <div class="clock-track"><div class="clock-fill" id="clockbar"></div></div>
    <div class="pimg" id="pimg"></div>
    <div class="pbot">
      <div class="pips" id="pips"></div>
      <div class="keys"><button class="p" data-k="p">Pass (P)</button><button class="c" data-k=" ">✓ Correct (Space)</button></div>
    </div>
  </div>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { b.blur(); onKey({ key: b.dataset.k, preventDefault() {} }); });
  document.getElementById("pimg").onclick = () => { if (T && (T.phase === "ready" || T.phase === "done")) onKey({ key: " ", preventDefault() {} }); };
  show(); loop(tick);
}
function show() {
  const box = document.getElementById("pimg"); if (!box || !T) return;
  const it = T.items[T.i]; box.className = "pimg" + (T.phase === "flash" ? " ok" : T.phase === "pass" ? " no" : "");
  if (T.phase === "ready") {
    box.innerHTML = T.kind === "solo"
      ? `<div class="msg"><div class="big-em">${esc(T.cat.emoji || "⚡")}</div><h2>Name as many as you can</h2><p>${T.practice ? "Tap Correct when you nail it, Pass when you're stuck" : "Every picture named scores +1 point. Say “Pass” to skip"} (-${G.cfg.pass}s).</p><div class="tap-pill">Tap or Press Space to Start</div></div>`
      : `<div class="msg"><div class="big-em">⚡</div><h2>Tiebreak Duel</h2><p>One player from each team. Your clock runs only on your turn—nail it to pass the pressure.<br><b>${TEAM[T.active]} goes first.</b></p><div class="tap-pill">Tap or Press Space to Start</div></div>`;
    setAnswer("Press Space to start");
  } else if (T.phase === "done") {
    box.innerHTML = `<div class="msg ${T.winner}"><div class="big-em">🏆</div><h2>${T.winner && SYM[T.winner] && !T.headline.includes(SYM[T.winner]) ? SYM[T.winner] + " " : ""}${esc(T.headline)}</h2><p>${esc(T.detail)}</p><div class="tap-pill">${T.practice && location.hash === "#practice" ? "Back to Stage Home" : "Back to the Board"}</div></div>`; setAnswer("");
  } else {
    box.innerHTML = `<img src="${esc(it.image_url)}" alt="">` + (T.phase === "flash" || T.phase === "pass" ? `<div class="ans">${esc(it.answer)}</div>` : ""); setAnswer(it.answer);
  }
  const pips = document.getElementById("pips"); if (pips && T.kind === "solo") pips.innerHTML = `${T.correct} <span style="font-size:.5em;opacity:.75;font-family:var(--font-display);letter-spacing:.08em">NAMED</span>`;
  if (T.kind === "duel") ["girls", "boys"].forEach(t => document.getElementById("d" + t)?.classList.toggle("act", T.active === t && T.phase !== "done"));
}
function advance() {
  do { T.i++; } while (T.i < T.items.length && T.items[T.i].bad);
  if (T.i >= T.items.length) return T.kind === "solo" ? endSolo("Out of pictures") : endDuel(T.time.girls >= T.time.boys ? "girls" : "boys", "Out of pictures");
  T.phase = "play"; show();
}
function tick(dt) {
  if (!T) return;
  if (T.phase === "flash") { T.hold -= dt; if (T.hold <= 0) { if (T.kind === "duel") T.active = other(T.active); advance(); } }
  else if (T.phase === "play" || T.phase === "pass") {
    if (T.kind === "solo") T.time -= dt; else T.time[T.active] -= dt;
    if (T.phase === "pass") { T.hold -= dt; if (T.hold <= 0) advance(); }
    const now = T.kind === "solo" ? T.time : T.time[T.active];
    const sec = Math.ceil(now);
    if (sec > 0 && sec <= 5 && sec !== T.lastSec) { T.lastSec = sec; beep(740, .06, "triangle", .09); }
    if (T && now <= 0 && T.phase !== "done") { beep(140, .6, "sawtooth", .18); T.kind === "solo" ? endSolo("Time's up") : endDuel(other(T.active), "Time's up"); }
  }
  if (!T) return;
  pushState();
  if (T.kind === "solo") {
    const c = document.getElementById("clock"), bar = document.getElementById("clockbar");
    if (c) { c.textContent = fmt(T.time); c.classList.toggle("low", T.time <= 10); }
    if (bar) { bar.style.width = `${Math.max(0, Math.min(100, (T.time / T.secs) * 100))}%`; bar.classList.toggle("low", T.time <= 10); }
  } else {
    ["girls", "boys"].forEach(t => { const c = document.getElementById("c" + t); if (c) { c.textContent = fmt(T.time[t]); c.classList.toggle("low", T.time[t] <= 10); } });
  }
}
function endSolo(why) {
  if (!T.practice) { G.own[T.cat.id] = { owner: T.team, pts: T.correct, player: T.player || undefined, round: roundOf(T.cat) }; G.pend = null; saveG(); }
  T.phase = "done"; T.winner = T.team;
  T.headline = T.practice ? `${T.correct} Named!` : `+${T.correct} ${T.correct === 1 ? "Point" : "Points"} for ${T.player || TEAM[T.team]}`;
  T.detail = T.practice ? `${why}. Practice round complete—nothing scored.` : `${why}. Added to the scoreboard!`;
  [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, .18), i * 130)); show();
}

/* ----- wildcard duel ----- */
function startDuel(cat) {
  const items = shuffle(cat.items); preload(items);
  T = { kind: "duel", cat, items, i: -1, time: { girls: G.cfg.duel, boys: G.cfg.duel }, active: Math.random() < .5 ? "girls" : "boys", phase: "ready", hold: 0, lastSec: null };
  app.innerHTML = `<div class="play wild">
    <div class="duelclocks">
      <div class="dside girls" id="dgirls"><span class="lbl dot" aria-label="Team Mrs.">${SYM.girls}</span><span class="clock" id="cgirls">${fmt(T.time.girls)}</span></div>
      <div class="duel-mid"><div class="who">⚡ Tiebreak Duel</div><h2>${esc(cat.emoji || "")} ${esc(cat.name)}</h2></div>
      <div class="dside boys" id="dboys"><span class="clock" id="cboys">${fmt(T.time.boys)}</span><span class="lbl dot" aria-label="Team Mr.">${SYM.boys}</span></div>
    </div>
    <div class="pimg" id="pimg"></div>
    <div class="pbot"><div class="muted">Correct passes the turn &middot; Pass costs ${G.cfg.pass}s and you stay up</div><div class="keys"><button class="p" data-k="p">Pass (P)</button><button class="c" data-k=" ">✓ Correct (Space)</button></div></div>
  </div>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { b.blur(); onKey({ key: b.dataset.k, preventDefault() {} }); });
  document.getElementById("pimg").onclick = () => { if (T && (T.phase === "ready" || T.phase === "done")) onKey({ key: " ", preventDefault() {} }); };
  show(); loop(tick);
}
function endDuel(winner, why) {
  G.own[T.cat.id] = { owner: winner, pts: 1 }; saveG();
  T.phase = "done"; T.winner = winner; T.headline = `${TEAM[winner]} Wins the Tiebreak (+1)`; T.detail = `${why} for ${TEAM[other(winner)]}.`;
  [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, .18), i * 130)); show();
}

/* ----- keys ----- */
function onKey(e) {
  if (!T || (!isHost() && location.hash !== "#practice")) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { if (T.practice || T.phase === "done" || T.phase === "ready" || confirm("Leave this round without scoring it?")) { leave(); } return; }
  const yes = k === " " || k === "enter" || k === "arrowright", no = k === "p" || k === "arrowdown";
  if (!yes && !no) return; e.preventDefault();
  if (T.phase === "ready") { if (yes) { T.lastSec = null; advance(); } return; }
  if (T.phase === "done") { if (yes) { leave(); } return; }
  if (T.phase !== "play") return;
  if (yes) { beep(880, .08); setTimeout(() => beep(1174, .12), 65); if (T.kind === "solo") T.correct++; T.phase = "flash"; T.hold = .7; show(); }
  else { beep(200, .25, "square", .14); T.phase = "pass"; T.hold = G.cfg.pass; show(); }
}
window.addEventListener("keydown", onKey);
route();
</script>
